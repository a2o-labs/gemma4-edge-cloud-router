[project]
name = "gemma4-router"
version = "0.1.0"
description = "Gemma4 Edge-Cloud Semantic Router V1 — local classifier + compact-schema cloud forwarder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "A2O Labs" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.54",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "torch>=2.4",
    "transformers>=4.45",
    "tiktoken>=0.7",
]
training = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "peft>=0.13",
]

[project.scripts]
gemma4-router = "router.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
