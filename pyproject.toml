[project]
name = "gemma4-router"
version = "0.1.0"
description = "Gemma4 Edge-Cloud Semantic Router V1 — local classifier + compact-schema cloud forwarder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "A2O Labs" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.54",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "torch>=2.4",
    "transformers>=4.45",
    "tiktoken>=0.7",
    "prometheus_client>=0.20",
]
training = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "peft>=0.13",
]
quantization = [
    "bitsandbytes>=0.43",
]
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.scripts]
gemma4-router = "router.api:run"
gemma4-router-cli = "router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: requires network and downloads small public model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
