services:
  router:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gemma4-router:dev
    ports:
      - "8080:8080"
    environment:
      EDGE_LLM_BASE_URL: http://edge-llm:8080/v1
      EDGE_LLM_API_KEY: edge-unused
      EDGE_LLM_MODEL: gemma4-4b
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-http://host.docker.internal:4000/v1}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-replace-with-litellm-key}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-claude-opus-4-7}
      MASK_MAP_TTL_SECONDS: "3600"
    depends_on:
      - edge-llm

  # Swap this sidecar for ollama / vllm / mlx as needed. Default: llama.cpp
  # server with a placeholder model volume the operator mounts themselves.
  edge-llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    command: >
      --host 0.0.0.0
      --port 8080
      -m /models/gemma4-4b.gguf
    volumes:
      - ${EDGE_LLM_MODEL_DIR:-./models}:/models:ro
    ports:
      - "18080:8080"
