apiVersion: v1
kind: Namespace
metadata:
  name: gemma4-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-inference
  namespace: gemma4-router
  labels:
    app: edge-inference
    component: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-inference
  template:
    metadata:
      labels:
        app: edge-inference
        component: edge
    spec:
      nodeSelector:
        gpu: l4
      containers:
        - name: edge
          image: ghcr.io/a2o-labs/gemma4-edge-inference:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "router.edge_inference_server"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          env:
            - name: ROUTER_EDGE_BIND
              value: "0.0.0.0:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: edge-inference
  namespace: gemma4-router
spec:
  type: ClusterIP
  selector:
    app: edge-inference
  ports:
    - name: http
      port: 8000
      targetPort: 8000
