apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-adapter-wrapper
  namespace: gemma4-router
  labels:
    app: cloud-adapter-wrapper
    component: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-adapter-wrapper
  template:
    metadata:
      labels:
        app: cloud-adapter-wrapper
        component: cloud
    spec:
      containers:
        - name: wrapper
          image: ghcr.io/a2o-labs/gemma4-cloud-adapter:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "router.cloud_adapter_server"]
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: VLLM_BASE_URL
              value: "http://cloud-vllm.gemma4-router.svc:8001/v1"
            - name: ADAPTER_BIND
              value: "0.0.0.0:8002"
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-adapter-wrapper
  namespace: gemma4-router
spec:
  type: ClusterIP
  selector:
    app: cloud-adapter-wrapper
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-router-cloud
  namespace: ai-infra
spec:
  type: ExternalName
  externalName: cloud-adapter-wrapper.gemma4-router.svc.cluster.local
  ports:
    - name: http
      port: 8002
      targetPort: 8002
