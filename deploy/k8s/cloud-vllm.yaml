apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: gemma4-router
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-vllm
  namespace: gemma4-router
  labels:
    app: cloud-vllm
    component: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-vllm
  template:
    metadata:
      labels:
        app: cloud-vllm
        component: cloud
    spec:
      nodeSelector:
        gpu: l4
      containers:
        - name: vllm
          image: vllm/vllm-openai:0.19.0
          args:
            - "--model"
            - "google/gemma-4-31b"
            - "--quantization"
            - "gguf"
            - "--max-model-len"
            - "8192"
            - "--port"
            - "8001"
            - "--host"
            - "0.0.0.0"
          ports:
            - name: http
              containerPort: 8001
          resources:
            requests:
              cpu: "2"
              memory: 20Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          env:
            - name: HF_HOME
              value: /hf
          volumeMounts:
            - name: hf-cache
              mountPath: /hf
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-vllm
  namespace: gemma4-router
spec:
  type: ClusterIP
  selector:
    app: cloud-vllm
  ports:
    - name: http
      port: 8001
      targetPort: 8001
